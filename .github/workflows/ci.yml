name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android build + unit tests + lint
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # v3 installs the legacy "tools" package by default; Google removed it
      # from the SDK repository, so pin v4 and request only platform-tools.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build native core (arm64 + x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ABIS="arm64-v8a x86_64" PROFILE=release ./scripts/build-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Format + lint
        run: ./gradlew :app:spotlessCheck :app:lintDebug --stacktrace
      - name: Assemble debug + release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: phonealvr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phonealvr-jnilibs
          path: app/src/main/jniLibs/

  emulator:
    name: Emulator instrumented tests
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # v3 installs the legacy "tools" package by default; Google removed it
      # from the SDK repository, so pin v4 and request only platform-tools.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: emulator
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - run: ABIS="x86_64" PROFILE=debug ./scripts/build-core.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: app/build/reports/androidTests/
