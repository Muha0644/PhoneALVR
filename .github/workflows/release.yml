name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # v3 installs the legacy "tools" package by default; Google removed it
      # from the SDK repository, so pin v4 and request only platform-tools.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build arm64 native core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ABIS="arm64-v8a" PROFILE=release ./scripts/build-core.sh
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONEALVR_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing PHONEALVR_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble signed release
        env:
          PHONEALVR_VERSION_NAME: ${{ inputs.version }}
          PHONEALVR_KEYSTORE: ${{ runner.temp }}/release.jks
          PHONEALVR_KEYSTORE_PASSWORD: ${{ secrets.PHONEALVR_KEYSTORE_PASSWORD }}
          PHONEALVR_KEY_ALIAS: ${{ secrets.PHONEALVR_KEY_ALIAS }}
          PHONEALVR_KEY_PASSWORD: ${{ secrets.PHONEALVR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: PhoneALVR v${{ inputs.version }}
          draft: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
